name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar URL do App
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://reurbtaguatinga.streamlit.app/'
          method: 'GET'
          timeout: 30000        # Aumenta o tempo limite para 30 segundos
          customHeaders: '{"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}'

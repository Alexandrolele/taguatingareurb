name: Keep Streamlit Alive

on:
  schedule:
    # Roda a cada 4 horas
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar app Streamlit
        run: |
          # O '|| true' garante que o workflow termine como sucesso mesmo 
          # se o servidor retornar um erro de redirecionamento.
          curl -I https://reurbtaguatinga.streamlit.app/ || true
